name: Validate candidate v2 receiver and six checkout paths
on:
  push:
    branches:
      - 'qa/new-receiver-final-20261128'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate deployment health
        run: node qa/check-new-receiver.cjs
      - name: Install browser test tool
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test six checkout paths against candidate
        run: node qa/check-candidate-checkout.cjs
