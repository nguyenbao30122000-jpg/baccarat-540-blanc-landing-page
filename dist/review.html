<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Duyệt giao diện · The Fragrance Lab</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/fonts/fonts.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'Be Vietnam Pro',Arial,sans-serif;background:#e9e3da;color:#32281f;overflow:hidden}header{height:74px;background:#282019;color:#f5e8d3;display:flex;align-items:center;justify-content:space-between;padding:12px 26px;gap:18px;box-shadow:0 2px 10px #0001}h1{font-size:14px;letter-spacing:.1em;font-weight:500;margin:0}header p{font-size:11px;color:#c9b79a;margin:4px 0 0}.controls{display:flex;align-items:center;gap:8px}button,a{font:inherit;font-size:12px;color:inherit}button{background:transparent;border:1px solid #79664e;border-radius:4px;padding:9px 14px;cursor:pointer;white-space:nowrap}button[aria-pressed=true]{background:#b38c50;color:#fff;border-color:#b38c50}a{color:#e6c590;text-decoration:none;margin-left:10px;white-space:nowrap}main{height:calc(100dvh - 74px);padding:22px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.frame-shell{width:100%;height:100%;flex-shrink:0;box-shadow:0 10px 40px #3b281920;background:#f7f0e6;overflow:hidden;border-radius:5px;transition:width .25s ease}iframe{border:0;width:100%;height:100%;display:block;background:#faf7f2}.size-caption{font-size:11px;color:#bba98e;min-width:64px;text-align:center}@media(max-width:700px){header{height:110px;flex-direction:column;align-items:flex-start;gap:10px;padding:12px 15px}.controls{width:100%;gap:6px}h1{font-size:12px}header p{display:none}button{font-size:11px;padding:7px 10px}a{font-size:11px;margin-left:auto}.size-caption{display:none}main{height:calc(100dvh - 110px);padding:10px}.frame-shell{max-width:100%!important}}@media(prefers-reduced-motion:reduce){.frame-shell{transition:none}}
</style></head><body><header><div><h1>THE FRAGRANCE LAB · TRẮNG & ĐỎ</h1><p>Bản duyệt giao diện · Chọn kích thước để xem</p></div><div class="controls" aria-label="Chọn kích thước màn hình"><button type="button" data-width="full" aria-pressed="true">Máy tính</button><button type="button" data-width="768" aria-pressed="false">Tablet</button><button type="button" data-width="390" aria-pressed="false">Điện thoại</button><span class="size-caption" id="size-label">Toàn chiều rộng</span><a href="./" target="_blank" rel="noopener">Mở trang</a></div></header><main><div class="frame-shell"><iframe id="site-preview" name="site-preview" src="./" title="Bộ đôi Baccarat 540 Trắng và Đỏ"></iframe></div></main><script>
const frame=document.querySelector('.frame-shell');const buttons=[...document.querySelectorAll('button[data-width]')];function setSize(width){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.width===width)));frame.style.width=width==='full'?'100%':width+'px';document.getElementById('size-label').textContent=width==='full'?'Toàn chiều rộng':width+' px'}buttons.forEach(b=>b.addEventListener('click',()=>setSize(b.dataset.width)));const requested=new URLSearchParams(location.search).get('width');if(['360','375','390','430','768','1024','full'].includes(requested))setSize(requested);
</script></body></html>
